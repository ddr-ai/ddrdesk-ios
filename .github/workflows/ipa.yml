name: Build unsigned IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version && xcodebuild -showsdks | head

      - name: Build iPhone / iPad (unsigned, device)
        env:
          BUILD: ${{ github.run_number }}
        run: |
          set -euo pipefail
          VERSION="1.0.${BUILD}"
          echo "Stamping MARKETING_VERSION=${VERSION} CURRENT_PROJECT_VERSION=${BUILD}"
          xcodebuild \
            -project DDRDesk.xcodeproj \
            -scheme DDRDesk \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            MARKETING_VERSION="${VERSION}" \
            CURRENT_PROJECT_VERSION="${BUILD}" \
            build

      - name: Package .ipa
        env:
          BUILD: ${{ github.run_number }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          APP=$(find DerivedData/Build/Products -name 'DDRDesk.app' -type d | head -n1)
          test -n "$APP"
          echo "Using $APP"
          file "$APP/DDRDesk"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist"
          rm -rf Payload DDRDesk.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -r DDRDesk.ipa Payload
          ls -lh DDRDesk.ipa

          export VERSION="1.0.${BUILD}"
          export SIZE=$(stat -f%z DDRDesk.ipa)
          export IPA_URL="https://github.com/ddr-ai/ddrdesk-ios/releases/download/unsigned-ipa/DDRDesk.ipa"
          export DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          python3 - << 'PY'
          import json, os, html as htmlmod
          version = os.environ["VERSION"]
          build = int(os.environ["BUILD"])
          size = int(os.environ["SIZE"])
          ipa = os.environ["IPA_URL"]
          date = os.environ["DATE"]
          notes = (os.environ.get("NOTES") or "Latest main").splitlines()[0].strip()
          notes_html = htmlmod.escape(notes)
          latest = {
            "version": version,
            "build": build,
            "ipaURL": ipa,
            "notes": notes,
            "date": date,
            "installPageURL": "https://ddr-ai.github.io/ddrdesk-ios/",
          }
          altstore = {
            "name": "DDRDesk",
            "identifier": "ai.ddr.DDRDesk.source",
            "sourceURL": "https://github.com/ddr-ai/ddrdesk-ios/releases/download/unsigned-ipa/altstore.json",
            "apps": [{
              "name": "DDRDesk",
              "bundleIdentifier": "ai.ddr.DDRDesk",
              "developerName": "ddr-ai",
              "subtitle": "Remote desktop for your Fedora laptop",
              "localizedDescription": "Native iPhone/iPad client for DDRDesk. Updates come from this source after each GitHub Actions build.",
              "iconURL": "https://raw.githubusercontent.com/ddr-ai/ddrdesk-ios/main/DDRDesk/Assets.xcassets/AppIcon.appiconset/AppIcon.png",
              "tintColor": "22D3EE",
              "category": "utilities",
              "versions": [{
                "version": version,
                "buildVersion": str(build),
                "date": date,
                "localizedDescription": notes,
                "downloadURL": ipa,
                "size": size,
                "minOSVersion": "17.0",
              }],
            }],
          }
          open("latest.json","w").write(json.dumps(latest, indent=2) + "\n")
          open("altstore.json","w").write(json.dumps(altstore, indent=2) + "\n")
          os.makedirs("site", exist_ok=True)
          enc = ipa.replace(":", "%3A").replace("/", "%2F")
          html = f"""<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>DDRDesk iOS update</title>
<style>
body {{ font-family: -apple-system, system-ui, sans-serif; margin: 0; background: #0b1220; color: #e8eef7; }}
main {{ max-width: 28rem; margin: 0 auto; padding: 1.5rem; }}
h1 {{ font-weight: 650; }}
.card {{ background: #162033; border-radius: 16px; padding: 1rem 1.1rem; margin: 1rem 0; }}
a.btn {{ display: block; text-align: center; padding: 0.9rem; margin: 0.55rem 0; border-radius: 12px; text-decoration: none; font-weight: 650; color: #041018; background: #22d3ee; }}
a.btn.alt {{ background: #94a3b8; }}
p, li {{ color: #b6c2d4; line-height: 1.45; }}
code {{ color: #f8fafc; }}
</style>
</head>
<body>
<main>
<h1>DDRDesk</h1>
<p>Install or update the iPhone/iPad app. Built on GitHub Actions — no Mac and no local Xcode.</p>
<div class="card">
<strong>{version}</strong> &nbsp; build {build}<br/>
<span>{notes_html}</span>
</div>
<p>Tap the installer you already have on this phone. After the first sideload, you should not need a computer.</p>
<a class="btn" href="altstore://install?url={enc}">Install with AltStore</a>
<a class="btn" href="sidestore://install?url={enc}">Install with SideStore</a>
<a class="btn" href="feather://install?url={enc}">Install with Feather</a>
<a class="btn" href="esign://install?url={enc}">Install with ESign</a>
<a class="btn" href="apple-magnifier://install?url={enc}">Install with TrollStore</a>
<a class="btn alt" href="{ipa}">Download DDRDesk.ipa</a>
<p>AltStore/SideStore source (add once):<br/>
<code>https://github.com/ddr-ai/ddrdesk-ios/releases/download/unsigned-ipa/altstore.json</code></p>
</main>
</body>
</html>
"""
          open("site/index.html","w").write(html)
          print(open("latest.json").read())
          PY

      - name: Publish phone install page
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true

      - uses: actions/upload-artifact@v4
        with:
          name: DDRDesk-unsigned-ipa
          path: |
            DDRDesk.ipa
            latest.json
            altstore.json
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ github.run_number }}
        run: |
          set -euo pipefail
          tag=unsigned-ipa
          notes="Unsigned arm64 iPhone/iPad IPA (build ${BUILD}).

          Phone install page (no Mac / no Xcode):
          https://ddr-ai.github.io/ddrdesk-ios/

          The app checks latest.json and opens AltStore, SideStore, Feather, ESign, or TrollStore on the phone.

          AltStore/SideStore source:
          https://github.com/ddr-ai/ddrdesk-ios/releases/download/unsigned-ipa/altstore.json

          Bundle ID: ai.ddr.DDRDesk"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" DDRDesk.ipa latest.json altstore.json --clobber
            # enable GitHub Pages from gh-pages if not already
            gh api -X POST repos/ddr-ai/ddrdesk-ios/pages -f source[branch]=gh-pages -f source[path]=/ >/dev/null 2>&1 || true
            gh release edit "$tag" --notes "$notes" --title "DDRDesk unsigned IPA (build ${BUILD})"
          else
            gh release create "$tag" DDRDesk.ipa latest.json altstore.json --title "DDRDesk unsigned IPA (build ${BUILD})" --notes "$notes"
          fi
