name: Build unsigned IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version && xcodebuild -showsdks | head

      - name: Build iPhone / iPad (unsigned, device)
        run: |
          set -euo pipefail
          xcodebuild \
            -project DDRDesk.xcodeproj \
            -scheme DDRDesk \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package .ipa
        run: |
          set -euo pipefail
          APP=$(find DerivedData/Build/Products -name 'DDRDesk.app' -type d | head -n1)
          test -n "$APP"
          echo "Using $APP"
          file "$APP/DDRDesk"
          rm -rf Payload DDRDesk.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -r DDRDesk.ipa Payload
          ls -lh DDRDesk.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: DDRDesk-unsigned-ipa
          path: DDRDesk.ipa
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=unsigned-ipa
          notes="Unsigned arm64 iPhone/iPad IPA (no signing). Download, sign with your Apple ID (Sideloadly, AltStore, or Xcode), then install.

          Bundle ID: ai.ddr.DDRDesk
          Platforms: iPhone + iPad"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" DDRDesk.ipa --clobber
            gh release edit "$tag" --notes "$notes"
          else
            gh release create "$tag" DDRDesk.ipa --title "DDRDesk unsigned IPA" --notes "$notes"
          fi
